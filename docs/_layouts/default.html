<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: "OaSis OS" }} — OaSis Docs</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #10b981; --green-hover: #059669; --green-light: #ecfdf5;
  --green-border: #a7f3d0;
  --text: #111827; --text-2: #374151; --text-3: #6b7280; --text-4: #9ca3af;
  --border: #e5e7eb; --bg: #ffffff; --bg-soft: #f9fafb;
  --bg-code: #1a1b2e; --bg-code-bar: #252636;
  --sidebar: 240px; --toc: 200px; --header-h: 54px; --radius: 8px;
}
body {
  font-family: 'Inter', -apple-system, sans-serif; color: var(--text);
  background: var(--bg); font-size: 14px; line-height: 1.6; display: flex;
}
a { text-decoration: none; color: var(--green); }
a:hover { text-decoration: underline; }
code {
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: 12px; background: var(--bg-soft);
  border: 1px solid var(--border); padding: 1px 5px;
  border-radius: 4px; color: var(--text-2);
}
table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
th { background: var(--green); color: #fff; font-weight: 600; }
tr:nth-child(even) td { background: var(--bg-soft); }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
.layout { display: flex; width: 100%; min-height: 100vh; }

/* Header */
.header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
  border-bottom: 1px solid var(--border); background: var(--bg);
  display: flex; align-items: center; padding: 0 24px; z-index: 100;
}
.header h1 { font-size: 16px; font-weight: 700; color: var(--text); }
.header h1 span { color: var(--green); }

/* Left Sidebar */
.sidebar {
  position: fixed; top: var(--header-h); left: 0; bottom: 0;
  width: var(--sidebar); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 16px 0; background: var(--bg); z-index: 90;
}
.sidebar a {
  display: block; padding: 6px 20px; font-size: 13px; color: var(--text-3);
  border-left: 2px solid transparent; transition: all 0.15s;
}
.sidebar a:hover { color: var(--text); background: var(--bg-soft); text-decoration: none; }
.sidebar a.active { color: var(--green); border-left-color: var(--green); font-weight: 600; }

/* Main */
main {
  margin-left: var(--sidebar); margin-top: var(--header-h);
  padding: 32px 48px; flex: 1; max-width: 860px;
}
h1 { font-size: 28px; margin: 0 0 8px; border-bottom: 2px solid var(--green); padding-bottom: 8px; }
h2 { font-size: 20px; margin: 28px 0 10px; color: var(--text-2); padding-top: 4px; }
h3 { font-size: 16px; margin: 20px 0 8px; }
p { margin: 8px 0; color: var(--text-2); }
ul, ol { margin: 8px 0; padding-left: 24px; }
li { margin-bottom: 4px; }
blockquote {
  border-left: 3px solid var(--green); padding: 8px 16px;
  margin: 12px 0; background: var(--bg-soft); border-radius: 0 var(--radius) var(--radius) 0;
}

/* Pre blocks — styled directly */
pre {
  background: var(--bg-code); color: #e2e8f0; padding: 16px;
  border-radius: var(--radius); overflow-x: auto; margin: 16px 0;
  font-size: 13px; line-height: 1.55;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  border: 1px solid var(--border);
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}
pre code {
  background: none !important; border: none !important;
  padding: 0 !important; color: inherit !important;
  font-family: inherit; font-size: inherit;
}
.hl-c { color: #6b7280; } .hl-k { color: #f472b6; }
.hl-s { color: #34d399; } .hl-n { color: #60a5fa; }
.hl-f { color: #fbbf24; }
.t-dim { color: #6b7280; } .t-green { color: #34d399; }
.t-blue { color: #60a5fa; } .t-yellow { color: #fbbf24; }

/* Right TOC */
.toc-right {
  position: sticky; top: var(--header-h);
  width: var(--toc); height: calc(100vh - var(--header-h));
  overflow-y: auto; padding: 24px 12px 24px 8px;
  border-left: 1px solid var(--border); flex-shrink: 0;
  display: none;
}
.toc-right.visible { display: block; }
.toc-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-4); margin-bottom: 10px;
}
.toc-item {
  display: block; padding: 3px 6px; font-size: 12px;
  color: var(--text-3); cursor: pointer; border-radius: 4px;
  transition: all .15s; text-decoration: none;
}
.toc-item:hover { background: var(--bg-soft); color: var(--text-2); }
.toc-item.active { color: var(--green); font-weight: 500; }
.toc-item.h2 { padding-left: 6px; }
.toc-item.h3 { padding-left: 18px; font-size: 11.5px; }

@media (max-width: 1024px) {
  .toc-right { display: none !important; }
}
@media (max-width: 768px) {
  .sidebar { display: none; }
  main { margin-left: 0; padding: 24px 16px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Oasis<span>OS</span></h1>
</div>

<div class="layout">

<div class="sidebar">
  {% for item in site.nav %}
  <a href="{{ item.url | relative_url }}"
    {% if page.url == item.url %}class="active"{% endif %}>
    {{ item.title }}
  </a>
  {% endfor %}
</div>

<main>
  {{ content }}
</main>

<div class="toc-right" id="toc">
  <div class="toc-label">On this page</div>
  <div id="toc-list"></div>
</div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Highlight sidebar link
  var links = document.querySelectorAll('.sidebar a');
  links.forEach(function(a) {
    if (a.href === window.location.href) a.classList.add('active');
  });

  // Build Table of Contents from h2/h3 in main
  var toc = document.getElementById('toc-list');
  var tocContainer = document.getElementById('toc');
  var headings = document.querySelectorAll('main h2, main h3');
  if (headings.length > 0) {
    tocContainer.classList.add('visible');
    headings.forEach(function(h, i) {
      var id = 'sec-' + i;
      h.id = id;
      var item = document.createElement('a');
      item.className = 'toc-item ' + h.tagName.toLowerCase();
      item.textContent = h.textContent;
      item.href = '#' + id;
      item.addEventListener('click', function(e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + id);
      });
      toc.appendChild(item);
    });

    // TOC scroll spy
    window.addEventListener('scroll', function() {
      var current = '';
      headings.forEach(function(h) {
        if (window.scrollY >= h.offsetTop - 80) current = h.id;
      });
      toc.querySelectorAll('.toc-item').forEach(function(item) {
        item.classList.toggle('active', item.getAttribute('href') === '#' + current);
      });
    });
  }
});
</script>
</body>
</html>
