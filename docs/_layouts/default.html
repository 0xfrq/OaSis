<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "OaSis Documentation" }}</title>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-code: #334155;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --accent: #4ade80;
            --accent2: #38bdf8;
            --border: #334155;
            --radius: 10px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }

        /* ===== Header ===== */
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }
        header h1 a { color: #fff; text-decoration: none; }
        header h1 span { color: var(--accent); }

        .menu-toggle {
            display: none;
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
        }

        /* ===== Navigation ===== */
        nav {
            background: #16213e;
            padding: 0.5rem 2rem;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
        }
        nav.collapsed { display: none; }

        nav ul {
            list-style: none;
            display: flex;
            gap: 0.25rem;
            flex-wrap: wrap;
            padding: 0;
        }

        nav li { margin: 0; }

        nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        nav a:hover { color: #fff; background: rgba(255,255,255,0.1); }
        nav a.active { color: var(--accent); background: rgba(74,222,128,0.1); font-weight: 600; }

        /* ===== Navigation Toggle ===== */
        @media (max-width: 720px) {
            .menu-toggle { display: block; }
            nav { display: none; }
            nav.open { display: block; }
        }

        /* ===== Main Content ===== */
        main {
            max-width: 920px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        article {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* ===== Typography ===== */
        h1, h2, h3, h4 {
            color: #fff;
            margin: 2rem 0 1rem;
            line-height: 1.3;
        }
        h1 { font-size: 2rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.75rem; margin-top: 0; }
        h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        h3 { font-size: 1.2rem; color: var(--accent2); }
        h4 { font-size: 1.05rem; }

        p { margin-bottom: 1rem; color: var(--text); }

        a { color: var(--accent2); transition: color 0.2s; }
        a:hover { color: var(--accent); text-decoration: underline; }

        /* ===== Code ===== */
        code {
            background: var(--bg-code);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 0.9em;
            color: var(--accent2);
        }

        pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 1.25rem;
            border-radius: var(--radius);
            overflow-x: auto;
            margin: 1.25rem 0;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            line-height: 1.5;
        }
        pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        /* ===== Lists ===== */
        ul, ol { margin: 1rem 0; padding-left: 1.75rem; }
        li { margin-bottom: 0.4rem; }

        /* ===== Tables ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.25rem 0;
            font-size: 0.9rem;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 0.6rem 0.75rem;
            text-align: left;
        }
        th {
            background: rgba(74,222,128,0.1);
            font-weight: 600;
            color: var(--accent);
        }
        tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

        /* ===== Blockquote ===== */
        blockquote {
            border-left: 4px solid var(--accent2);
            padding: 1rem 1.25rem;
            margin: 1.25rem 0;
            background: rgba(56,189,248,0.05);
            border-radius: 0 var(--radius) var(--radius) 0;
            color: var(--text-dim);
        }

        /* ===== Notes & Highlights ===== */
        .note {
            background: rgba(74,222,128,0.08);
            border: 1px solid var(--accent);
            padding: 1rem 1.25rem;
            border-radius: var(--radius);
            margin: 1.25rem 0;
        }
        .note code { background: rgba(74,222,128,0.15); }

        .warn {
            background: rgba(251,191,36,0.1);
            border: 1px solid #fbbf24;
            padding: 1rem 1.25rem;
            border-radius: var(--radius);
            margin: 1.25rem 0;
        }

        /* ===== Status Badges ===== */
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-ok { background: rgba(74,222,128,0.2); color: var(--accent); }
        .badge-wip { background: rgba(251,191,36,0.2); color: #fbbf24; }

        /* ===== Footer ===== */
        footer {
            text-align: center;
            padding: 2.5rem 2rem;
            color: var(--text-dim);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            header h1 { font-size: 1.1rem; }
            article { padding: 1.25rem; }
            main { padding: 0 0.75rem; margin: 1rem auto; }
            pre { font-size: 0.8rem; padding: 0.75rem; }
            table { font-size: 0.8rem; }
            th, td { padding: 0.4rem 0.5rem; }
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        /* ===== Print ===== */
        @media print {
            header, nav, footer { display: none; }
            body { background: #fff; color: #000; }
            article { box-shadow: none; border: none; }
            code { background: #f5f5f5; }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">OaSis<span>Docs</span></a></h1>
        <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
    </header>

    <nav id="nav">
        <ul>
            {% for item in site.nav %}
            <li><a href="{{ item.url | relative_url }}"
                {% if page.url == item.url or page.url contains item.url %}class="active"{% endif %}>
                {{ item.title }}
            </a></li>
            {% endfor %}
        </ul>
    </nav>

    <main>
        <article>
            {{ content }}
        </article>
    </main>

    <footer>
        <p>OaSis — Sistem Operasi Edukasi &bull; Dibuat dengan kopi dan rasa penasaran ☕</p>
        <p style="margin-top:0.5rem; font-size:0.8rem;">
            <a href="https://github.com/0xfrq/OaSis">GitHub</a>
        </p>
    </footer>

    <script>
        // Highlight current page in nav
        document.querySelectorAll('nav a').forEach(function(a) {
            if (a.href === window.location.href) a.classList.add('active');
        });
    </script>
</body>
</html>
