<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: "OaSis OS" }} — OaSis Docs</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #10b981; --green-hover: #059669; --green-light: #ecfdf5;
  --green-border: #a7f3d0;
  --text: #111827; --text-2: #374151; --text-3: #6b7280; --text-4: #9ca3af;
  --border: #e5e7eb; --bg: #ffffff; --bg-soft: #f9fafb;
  --bg-code: #1a1b2e; --bg-code-bar: #252636;
  --sidebar: 260px; --header-h: 54px; --radius: 8px;
}
body {
  font-family: 'Inter', -apple-system, sans-serif; color: var(--text);
  background: var(--bg); font-size: 14px; line-height: 1.6; display: flex;
}
a { text-decoration: none; color: var(--green); }
a:hover { text-decoration: underline; }
code {
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: 12px; background: var(--bg-soft);
  border: 1px solid var(--border); padding: 1px 5px;
  border-radius: 4px; color: var(--text-2);
}
table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
th { background: var(--green); color: #fff; font-weight: 600; }
tr:nth-child(even) td { background: var(--bg-soft); }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* Header */
.header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
  border-bottom: 1px solid var(--border); background: var(--bg);
  display: flex; align-items: center; padding: 0 24px; z-index: 100;
}
.header h1 { font-size: 16px; font-weight: 700; color: var(--text); }
.header h1 span { color: var(--green); }

/* Sidebar */
.sidebar {
  position: fixed; top: var(--header-h); left: 0; bottom: 0;
  width: var(--sidebar); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 16px 0; background: var(--bg);
}
.sidebar a {
  display: block; padding: 6px 20px; font-size: 13px; color: var(--text-3);
  border-left: 2px solid transparent; transition: all 0.15s;
}
.sidebar a:hover { color: var(--text); background: var(--bg-soft); text-decoration: none; }
.sidebar a.active { color: var(--green); border-left-color: var(--green); font-weight: 600; }

/* Main */
main {
  margin-left: var(--sidebar); margin-top: var(--header-h);
  padding: 32px 48px; max-width: 860px; flex: 1;
}
h1 { font-size: 28px; margin: 0 0 8px; border-bottom: 2px solid var(--green); padding-bottom: 8px; }
h2 { font-size: 20px; margin: 28px 0 10px; color: var(--text-2); }
h3 { font-size: 16px; margin: 20px 0 8px; }
p { margin: 8px 0; color: var(--text-2); }
ul, ol { margin: 8px 0; padding-left: 24px; }
li { margin-bottom: 4px; }
blockquote {
  border-left: 3px solid var(--green); padding: 8px 16px;
  margin: 12px 0; background: var(--bg-soft); border-radius: 0 var(--radius) var(--radius) 0;
}

/* === Code block from index.html template === */
.code-block {
  border: 1px solid var(--border); border-radius: 9px;
  overflow: hidden; margin: 18px 0;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}
.code-top {
  background: var(--bg-code-bar); padding: 7px 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.code-lang {
  font-size: 11px; font-weight: 500; color: var(--text-4);
  text-transform: uppercase; letter-spacing: .05em;
}
.copy-btn {
  background: rgba(255,255,255,.08); border: none; cursor: pointer;
  color: var(--text-4); font-size: 11px; font-family: 'Inter', sans-serif;
  padding: 3px 10px; border-radius: 4px; transition: all .15s;
}
.copy-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
.code-body { overflow-x: auto; }
.code-body pre {
  background: var(--bg-code); color: #e2e8f0; padding: 16px;
  margin: 0; font-size: 13px; line-height: 1.55;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
}
.code-body pre code {
  background: none; border: none; padding: 0; color: inherit;
  font-family: inherit; font-size: inherit;
}
/* Syntax highlighting */
.hl-c { color: #6b7280; }    /* comment */
.hl-k { color: #f472b6; }    /* keyword */
.hl-s { color: #34d399; }    /* string */
.hl-n { color: #60a5fa; }    /* number */
.hl-f { color: #fbbf24; }    /* function */
.t-dim { color: #6b7280; }
.t-green { color: #34d399; }
.t-blue { color: #60a5fa; }
.t-yellow { color: #fbbf24; }

@media (max-width: 768px) {
  .sidebar { display: none; }
  main { margin-left: 0; padding: 24px 16px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Oasis<span>OS</span></h1>
</div>

<div class="sidebar">
  {% for item in site.nav %}
  <a href="{{ item.url | relative_url }}"
    {% if page.url == item.url %}class="active"{% endif %}>
    {{ item.title }}
  </a>
  {% endfor %}
</div>

<main>
  {{ content }}
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var links = document.querySelectorAll('.sidebar a');
  links.forEach(function(a) {
    if (a.href === window.location.href) a.classList.add('active');
  });
});
</script>
</body>
</html>
